<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة الإدارة - أفواج التربص</title>
<style>
  :root{
    --primary:#0d6efd;
    --primary-dark:#0b5ed7;
    --danger:#dc3545;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1e2430;
    --muted:#6c757d;
    --border:#e2e6ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:24px 12px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  h1{text-align:center;font-size:1.4rem;margin-bottom:24px;}
  .card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:24px;margin-bottom:20px;}
  .login-card{max-width:360px;margin:60px auto 0;text-align:center;}
  input[type="password"]{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;
    font-size:1rem;margin:14px 0;text-align:center;
  }
  button{
    padding:12px 20px;border:none;border-radius:10px;background:var(--primary);
    color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:.15s;
  }
  button:hover{background:var(--primary-dark);}
  .error-text{color:var(--danger);font-size:.85rem;min-height:18px;}
  #dashboard{display:none;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
  .summary{display:grid;grid-template-columns:repeat(auto-fit, minmax(120px,1fr));gap:10px;margin-bottom:24px;}
  .summary .box{background:#fafbfc;border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
  .summary .box .num{font-size:1.3rem;font-weight:700;color:var(--primary);}
  .summary .box .lbl{font-size:.75rem;color:var(--muted);}
  table{width:100%;border-collapse:collapse;margin-bottom:24px;font-size:.9rem;}
  th, td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;}
  th{background:#f8f9fb;font-weight:700;}
  .group-title{font-weight:700;font-size:1.05rem;margin:0 0 10px;display:flex;justify-content:space-between;}
  .group-title .count{font-weight:400;font-size:.85rem;color:var(--muted);}
  .empty-row td{color:var(--muted);font-style:italic;text-align:center;}
  .export-btn{background:#198754;}
  .export-btn:hover{background:#157347;}
</style>
</head>
<body>
<div class="wrap">
  <h1>صفحة الإدارة - أفواج التربص</h1>

  <div class="card login-card" id="loginCard">
    <div>أدخل كلمة السر للدخول</div>
    <input type="password" id="passwordInput" placeholder="كلمة السر">
    <div class="error-text" id="loginError"></div>
    <button id="loginBtn">دخول</button>
  </div>

  <div id="dashboard">
    <div class="top-bar">
      <div></div>
      <button class="export-btn" id="exportBtn">تصدير إلى Excel 📊</button>
    </div>

    <div class="summary" id="summaryBox"></div>

    <div id="groupsTables"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  // ⚠️ غيّر كلمة السر هذي قبل ما ترفع الملف لـ GitHub
  const ADMIN_PASSWORD = "Stage2027";

  const firebaseConfig = {
    apiKey: "AIzaSyCVWdL8aoJQFm7ZXj3GaxpXtrqV69zLW2M",
    authDomain: "stage-3eme-medecine.firebaseapp.com",
    databaseURL: "https://stage-3eme-medecine-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "stage-3eme-medecine",
    storageBucket: "stage-3eme-medecine.firebasestorage.app",
    messagingSenderId: "421324918267",
    appId: "1:421324918267:web:094f8cc394a5f6915b8f5e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const GROUPS = { "11": 10, "12": 9, "13": 15, "14": 10, "15": 8, "16": 12 };

  const loginCard = document.getElementById('loginCard');
  const dashboard = document.getElementById('dashboard');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const summaryBox = document.getElementById('summaryBox');
  const groupsTables = document.getElementById('groupsTables');
  const exportBtn = document.getElementById('exportBtn');

  let allData = {}; // { groupId: [ {firstName, lastName, timestamp}, ... ] }

  function tryLogin(){
    if(passwordInput.value === ADMIN_PASSWORD){
      loginCard.style.display = 'none';
      dashboard.style.display = 'block';
      loadData();
    } else {
      loginError.textContent = 'كلمة السر غير صحيحة';
    }
  }
  loginBtn.addEventListener('click', tryLogin);
  passwordInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryLogin(); });

  function formatDate(ts){
    if(!ts) return '-';
    const d = new Date(ts);
    return d.toLocaleString('fr-FR');
  }

  function loadData(){
    Object.keys(GROUPS).forEach(groupId => {
      db.ref('groups/' + groupId + '/members').orderByChild('timestamp').on('value', snap => {
        const list = [];
        snap.forEach(child => {
          const v = child.val();
          list.push({ firstName: v.firstName, lastName: v.lastName, timestamp: v.timestamp });
        });
        allData[groupId] = list;
        render();
      });
    });
  }

  function render(){
    // Summary boxes
    let totalRegistered = 0, totalMax = 0;
    summaryBox.innerHTML = Object.keys(GROUPS).map(groupId => {
      const count = (allData[groupId] || []).length;
      totalRegistered += count;
      totalMax += GROUPS[groupId];
      return `<div class="box"><div class="num">${count}/${GROUPS[groupId]}</div><div class="lbl">الفوج ${groupId}</div></div>`;
    }).join('') + `<div class="box"><div class="num">${totalRegistered}/${totalMax}</div><div class="lbl">المجموع</div></div>`;

    // Tables per group
    groupsTables.innerHTML = Object.keys(GROUPS).map(groupId => {
      const list = allData[groupId] || [];
      const rows = list.length
        ? list.map((m, i) => `<tr><td>${i+1}</td><td>${m.firstName}</td><td>${m.lastName}</td><td>${formatDate(m.timestamp)}</td></tr>`).join('')
        : `<tr class="empty-row"><td colspan="4">لا يوجد مسجلون بعد</td></tr>`;
      return `
        <div class="card">
          <div class="group-title">الفوج ${groupId} <span class="count">${list.length} / ${GROUPS[groupId]}</span></div>
          <table>
            <thead><tr><th>#</th><th>الاسم</th><th>اللقب</th><th>تاريخ ووقت التسجيل</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }).join('');
  }

  exportBtn.addEventListener('click', () => {
    const wb = XLSX.utils.book_new();

    // Summary sheet
    const summaryRows = [["الفوج", "المسجلون", "الحد الأقصى"]];
    Object.keys(GROUPS).forEach(groupId => {
      summaryRows.push([groupId, (allData[groupId] || []).length, GROUPS[groupId]]);
    });
    const summarySheet = XLSX.utils.aoa_to_sheet(summaryRows);
    XLSX.utils.book_append_sheet(wb, summarySheet, "ملخص");

    // One sheet per group
    Object.keys(GROUPS).forEach(groupId => {
      const list = allData[groupId] || [];
      const rows = [["#", "الاسم", "اللقب", "تاريخ ووقت التسجيل"]];
      list.forEach((m, i) => rows.push([i+1, m.firstName, m.lastName, formatDate(m.timestamp)]));
      const sheet = XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, sheet, "Groupe " + groupId);
    });

    XLSX.writeFile(wb, "افواج_التربص.xlsx");
  });
</script>
</body>
</html>
