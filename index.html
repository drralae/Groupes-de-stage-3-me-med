<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل أفواج التربص</title>
<style>
  :root{
    --primary:#0d6efd;
    --primary-dark:#0b5ed7;
    --success:#198754;
    --danger:#dc3545;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1e2430;
    --muted:#6c757d;
    --border:#e2e6ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px 12px 60px;
  }
  .wrap{
    width:100%;
    max-width:640px;
  }
  h1{
    text-align:center;
    font-size:1.4rem;
    margin-bottom:4px;
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:.9rem;
    margin-bottom:24px;
  }
  .card{
    background:var(--card);
    border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    padding:20px;
    margin-bottom:20px;
  }
  label{
    display:block;
    font-weight:600;
    margin-bottom:6px;
    font-size:.92rem;
  }
  input[type="text"]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:1rem;
    margin-bottom:16px;
    background:#fafbfc;
  }
  input[type="text"]:focus{
    outline:none;
    border-color:var(--primary);
    background:#fff;
  }
  .groups{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    margin-bottom:8px;
  }
  @media (max-width:420px){
    .groups{grid-template-columns:1fr;}
  }
  .group-option{
    border:2px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    transition:.15s;
    position:relative;
    background:#fafbfc;
  }
  .group-option:hover{border-color:#c8d3e0;}
  .group-option.selected{
    border-color:var(--primary);
    background:#eaf2ff;
  }
  .group-option.full{
    cursor:not-allowed;
    opacity:.6;
    background:#f4f4f4;
  }
  .group-option.full:hover{border-color:var(--border);}
  .group-name{
    font-weight:700;
    font-size:1rem;
    margin-bottom:4px;
  }
  .group-count{
    font-size:.85rem;
    color:var(--muted);
  }
  .badge-full{
    position:absolute;
    top:8px;left:8px;
    background:var(--danger);
    color:#fff;
    font-size:.7rem;
    padding:2px 8px;
    border-radius:20px;
  }
  .progress{
    height:6px;
    background:#e6e9ee;
    border-radius:4px;
    margin-top:8px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    background:var(--primary);
    transition:width .3s;
  }
  .group-option.full .progress-bar{background:var(--danger);}
  button#submitBtn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    color:#fff;
    font-size:1.05rem;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
  }
  button#submitBtn:hover{background:var(--primary-dark);}
  button#submitBtn:disabled{
    background:#adb5bd;
    cursor:not-allowed;
  }
  .msg{
    text-align:center;
    padding:14px;
    border-radius:10px;
    margin-top:16px;
    font-size:.95rem;
    display:none;
  }
  .msg.success{
    display:block;
    background:#e7f6ec;
    color:var(--success);
    border:1px solid #bfe6cc;
  }
  .msg.error{
    display:block;
    background:#fdeaea;
    color:var(--danger);
    border:1px solid #f3c2c2;
  }
  .loading-overlay{
    text-align:center;
    color:var(--muted);
    font-size:.9rem;
    padding:10px;
  }
  .spinner{
    display:inline-block;
    width:14px;height:14px;
    border:2px solid #fff;
    border-top-color:transparent;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:middle;
    margin-left:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <h1>تسجيل الأفواج - تربص</h1>
  <div class="subtitle">من فضلك اختر فوجك وسجل اسمك ولقبك</div>

  <div class="card">
    <label for="firstName">الاسم</label>
    <input type="text" id="firstName" placeholder="اكتب اسمك">

    <label for="lastName">اللقب</label>
    <input type="text" id="lastName" placeholder="اكتب لقبك">

    <label>اختر الفوج</label>
    <div class="groups" id="groupsContainer">
      <div class="loading-overlay">جارٍ تحميل الأفواج...</div>
    </div>

    <button id="submitBtn" disabled>تسجيل</button>
    <div class="msg" id="msgBox"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCVWdL8aoJQFm7ZXj3GaxpXtrqV69zLW2M",
    authDomain: "stage-3eme-medecine.firebaseapp.com",
    databaseURL: "https://stage-3eme-medecine-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "stage-3eme-medecine",
    storageBucket: "stage-3eme-medecine.firebasestorage.app",
    messagingSenderId: "421324918267",
    appId: "1:421324918267:web:094f8cc394a5f6915b8f5e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Groups and their maximum capacity
  const GROUPS = {
    "11": 10,
    "12": 9,
    "13": 15,
    "14": 10,
    "15": 8,
    "16": 12
  };

  const groupsContainer = document.getElementById('groupsContainer');
  const submitBtn = document.getElementById('submitBtn');
  const msgBox = document.getElementById('msgBox');
  const firstNameInput = document.getElementById('firstName');
  const lastNameInput = document.getElementById('lastName');

  let selectedGroup = null;
  let currentCounts = {};

  function renderGroups(){
    groupsContainer.innerHTML = '';
    Object.keys(GROUPS).forEach(groupId => {
      const max = GROUPS[groupId];
      const count = currentCounts[groupId] || 0;
      const isFull = count >= max;
      const pct = Math.min(100, Math.round((count / max) * 100));

      const div = document.createElement('div');
      div.className = 'group-option' + (isFull ? ' full' : '') + (selectedGroup === groupId ? ' selected' : '');
      div.innerHTML = `
        ${isFull ? '<span class="badge-full">مكتمل</span>' : ''}
        <div class="group-name">الفوج ${groupId}</div>
        <div class="group-count">${count} / ${max}</div>
        <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
      `;
      if(!isFull){
        div.addEventListener('click', () => {
          selectedGroup = groupId;
          renderGroups();
          updateSubmitState();
        });
      }
      groupsContainer.appendChild(div);
    });
  }

  function updateSubmitState(){
    const name = firstNameInput.value.trim();
    const surname = lastNameInput.value.trim();
    submitBtn.disabled = !(name && surname && selectedGroup);
  }

  firstNameInput.addEventListener('input', updateSubmitState);
  lastNameInput.addEventListener('input', updateSubmitState);

  // Listen live to counts so the UI locks groups automatically as they fill
  Object.keys(GROUPS).forEach(groupId => {
    db.ref('groups/' + groupId + '/count').on('value', snap => {
      currentCounts[groupId] = snap.val() || 0;
      // if the currently selected group just became full (someone else took the last spot), deselect it
      if(selectedGroup === groupId && currentCounts[groupId] >= GROUPS[groupId]){
        selectedGroup = null;
      }
      renderGroups();
      updateSubmitState();
    });
  });

  function showMsg(text, type){
    msgBox.className = 'msg ' + type;
    msgBox.textContent = text;
  }

  submitBtn.addEventListener('click', () => {
    const name = firstNameInput.value.trim();
    const surname = lastNameInput.value.trim();
    if(!name || !surname || !selectedGroup) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = 'جارٍ التسجيل...<span class="spinner"></span>';

    const groupId = selectedGroup;
    const max = GROUPS[groupId];
    const countRef = db.ref('groups/' + groupId + '/count');

    // Atomic transaction: only increments and reserves a spot if under max.
    // This prevents two people from taking the last spot at the same time.
    countRef.transaction(current => {
      const c = current || 0;
      if(c >= max){
        return; // abort transaction, group is full
      }
      return c + 1;
    }, (error, committed) => {
      if(error){
        showMsg('حدث خطأ، حاول مرة أخرى.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'تسجيل';
        return;
      }
      if(!committed){
        showMsg('عذراً، هذا الفوج اكتمل للتو. اختر فوجاً آخر.', 'error');
        selectedGroup = null;
        submitBtn.textContent = 'تسجيل';
        renderGroups();
        updateSubmitState();
        return;
      }
      // Slot reserved successfully, now save the member's info
      const memberRef = db.ref('groups/' + groupId + '/members').push();
      memberRef.set({
        firstName: name,
        lastName: surname,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).then(() => {
        showMsg('تم تسجيلك بنجاح في الفوج ' + groupId + ' ✅', 'success');
        firstNameInput.value = '';
        lastNameInput.value = '';
        selectedGroup = null;
        submitBtn.textContent = 'تسجيل';
        renderGroups();
        updateSubmitState();
      });
    });
  });

  renderGroups();
</script>
</body>
</html>
